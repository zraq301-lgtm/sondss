<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق رقة | الإشعارات الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --p2: #eb2f96; --soft: #fff0f6; }
        body { font-family: 'Tajawal', sans-serif; background: #fffcfd; margin: 0; }
        .top-nav { background: #fff; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .logo { font-weight: bold; color: var(--p2); font-size: 24px; }
        
        /* أيقونة الجرس */
        .bell-btn { position: relative; cursor: pointer; font-size: 22px; color: var(--p2); }
        .badge { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 10px; width: 15px; height: 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        .noti-box { position: fixed; top: 60px; left: 10px; right: 10px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: none; z-index: 2000; max-height: 70vh; overflow-y: auto; }
        .noti-item { padding: 15px; border-bottom: 1px solid #f0f0f0; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="logo">رقة</div>
        <div class="bell-btn" onclick="toggleNoti()">
            <i class="fas fa-bell"></i>
            <span id="noti-count" class="badge" style="display:none;">0</span>
        </div>
    </header>

    <div id="noti-box" class="noti-box">
        <div style="padding:15px; font-weight:bold; border-bottom:1px solid #eee; color:var(--p2);">تنبيهات طبيبة رقة 🤖</div>
        <div id="noti-list"></div>
    </div>

    <div style="padding: 20px; text-align: center;">
        <button onclick="addEntry()" style="background:var(--p2); color:white; border:none; padding:15px 30px; border-radius:30px; font-family:'Tajawal';">تسجيل بيانات جديدة</button>
    </div>

    <script>
        const userId = localStorage.getItem('raqqa_user_id') || 'USER-2UZP6L'; // المعرف الظاهر في صورتك

        // دالة جلب الإشعارات (رد الذكاء الاصطناعي)
        async function fetchNotifications() {
            try {
                const res = await fetch(`/api/get-notifications?user_id=${userId}`);
                const data = await res.json();
                const list = document.getElementById('noti-list');
                const badge = document.getElementById('noti-count');

                if (data.notifications && data.notifications.length > 0) {
                    badge.style.display = 'flex';
                    badge.innerText = data.notifications.length;
                    list.innerHTML = data.notifications.map(n => `
                        <div class="noti-item">
                            <small style="color:#999;">${new Date(n.created_at).toLocaleDateString('ar-EG')}</small><br>
                            ${n.body}
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div style="padding:20px; text-align:center; color:#ccc;">لا توجد نصائح جديدة بعد</div>';
                }
            } catch (e) { console.error("Error fetching notifications"); }
        }

        async function addEntry() {
            const { value: val } = await Swal.fire({
                title: 'تسجيل قياس السكر',
                input: 'number',
                inputLabel: 'ادخلي القيمة الحالية',
                showCancelButton: true
            });

            if (val) {
                Swal.fire({ title: 'جاري التحليل الذكي...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                await fetch('/api/health-tracking', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, category: 'السكر', value: val, note: 'تم التسجيل يدوياً' })
                });
                Swal.fire('تم الحفظ! تحققي من الجرس بعد قليل ✨');
                setTimeout(fetchNotifications, 3000); // تحديث الجرس بعد 3 ثواني
            }
        }

        function toggleNoti() {
            const box = document.getElementById('noti-box');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        window.onload = fetchNotifications;
    </script>
</body>
</html>

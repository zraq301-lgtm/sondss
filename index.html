<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عالم سندس العبقرية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --rose-light: #fff0f5;
            --rose-main: #ff66b2;
            --rose-soft: #ffb7c5;
            --grad-rose: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
        }

        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background: var(--rose-light);
            background-image: radial-gradient(circle at center, #fff0f5, #fecfef);
            color: #5d1049;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .page {
            display: none;
            flex: 1;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
            padding-bottom: 100px;
        }

        .active { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .welcome-msg {
            font-size: 2.2rem;
            color: var(--rose-main);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .sondos-frame {
            width: 260px;
            height: 360px;
            border: 8px solid white;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(255, 102, 178, 0.3);
            background: #fce4ec; /* خلفية احتياطية */
        }

        .sondos-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nav-dock {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 20px;
            padding: 12px 30px;
            border-radius: 50px;
            border: 2px solid var(--rose-soft);
            z-index: 1000;
        }

        .nav-btn {
            color: #d8a4b8;
            font-size: 1.7rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn.active { color: var(--rose-main); transform: scale(1.2); }

        #canvas-wrapper {
            background: white;
            border: 3px solid var(--rose-soft);
            border-radius: 20px;
            margin: 10px auto;
            width: 95%;
            height: 350px;
        }

        canvas { width: 100%; height: 100%; touch-action: none; border-radius: 17px; }

        .art-tools {
            margin-bottom: 90px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn-rose {
            background: var(--grad-rose);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            color: #5d1049;
            font-weight: bold;
            cursor: pointer;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 25px;
            margin: 15px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <section id="home" class="page active">
        <div class="hero">
            <h1 class="welcome-msg">أهلاً بكِ يا سندس 🌸</h1>
            <div class="sondos-frame">
                <img src="IMG-20250713-WA0003.jpg" alt="سندس العبقرية" onerror="this.src='IMG-20250713-WA0003.jpg'">
            </div>
            <p style="color: #a04060; margin-top:10px;">عبقرية العلوم والجمال</p>
        </div>
    </section>

    <section id="secrets" class="page">
        <h2 style="color: var(--rose-main)">🔐 حجرة الأسرار</h2>
        <div class="card" id="quiz-area">
            <h3 id="question-display">تحميل لغز العلوم...</h3>
            <div id="answers-grid"></div>
        </div>
        <p>النقاط: <span id="points-count">0</span> ✨</p>
    </section>

    <section id="medical" class="page">
        <h2 style="color: var(--rose-main)">🩺 طب سندس</h2>
        <div class="card" onclick="alert('الأعصاب: رسائل سريعة تجعلك ذكية!')">🧠 الجهاز العصبي</div>
        <div class="card" onclick="alert('الخلايا: هي أساس بناء جسمك العجيب.')">🧬 الخلية</div>
    </section>

    <section id="lab" class="page">
        <h2 style="color: var(--rose-main)">🧪 معمل سندس</h2>
        <div id="beaker-icon" style="font-size: 80px;">🧪</div>
        <button class="btn-rose" onclick="mix()">إضافة مادة سحرية</button>
    </section>

    <section id="art" class="page">
        <h2 style="color: var(--rose-main)">🎨 لوحة إبداع سندس</h2>
        <div id="canvas-wrapper">
            <canvas id="mainCanvas"></canvas>
        </div>
        <div class="art-tools">
            <input type="color" id="colorPicker" value="#ff66b2">
            <button class="btn-rose" onclick="clearBoard()">مسح</button>
            <button class="btn-rose" onclick="downloadArt()">حفظ الرسمة</button>
        </div>
    </section>

    <nav class="nav-dock">
        <div class="nav-btn active" onclick="goPage('home', this)"><i class="fas fa-home"></i></div>
        <div class="nav-btn" onclick="goPage('secrets', this)"><i class="fas fa-magic"></i></div>
        <div class="nav-btn" onclick="goPage('medical', this)"><i class="fas fa-heartbeat"></i></div>
        <div class="nav-btn" onclick="goPage('lab', this)"><i class="fas fa-vial"></i></div>
        <div class="nav-btn" onclick="goPage('art', this)"><i class="fas fa-palette"></i></div>
    </nav>

    <script>
        function goPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            btn.classList.add('active');
            if(pageId === 'art') initDrawing();
        }

        let score = 0;
        function loadScienceTask() {
            document.getElementById('question-display').innerText = "ما هو غاز الحياة؟";
            const grid = document.getElementById('answers-grid');
            grid.innerHTML = '<button class="btn-rose" onclick="check(true)">الأكسجين</button>';
        }
        function check(v) { if(v) score += 10; document.getElementById('points-count').innerText = score; }
        loadScienceTask();

        function mix() { document.getElementById('beaker-icon').style.color = '#'+Math.floor(Math.random()*16777215).toString(16); }

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        function initDrawing() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            ctx.lineWidth = 5; ctx.lineCap = 'round';
        }

        canvas.onmousedown = (e) => { drawing = true; draw(e); };
        canvas.onmouseup = () => { drawing = false; ctx.beginPath(); };
        canvas.onmousemove = (e) => draw(e);

        canvas.ontouchstart = (e) => { drawing = true; draw(e.touches[0]); };
        canvas.ontouchend = () => { drawing = false; ctx.beginPath(); };
        canvas.ontouchmove = (e) => draw(e.touches[0]);

        function draw(e) {
            if(!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.strokeStyle = document.getElementById('colorPicker').value;
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke(); ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function clearBoard() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function downloadArt() {
            const link = document.createElement('a');
            link.download = 'art.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
            </html>

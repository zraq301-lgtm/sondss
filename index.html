<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عالم سندس العبقرية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --rose-light: #fff0f5;
            --rose-main: #ff66b2;
            --rose-soft: #ffb7c5;
            --grad-rose: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
        }

        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background: var(--rose-light);
            background-image: radial-gradient(circle at center, #fff0f5, #fecfef);
            color: #5d1049;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .page {
            display: none;
            flex: 1;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
            padding-bottom: 100px;
        }

        .active { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .welcome-msg {
            font-size: 2.2rem;
            color: var(--rose-main);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .sondos-frame {
            width: 260px;
            height: 360px;
            border: 8px solid white;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(255, 102, 178, 0.3);
            background: #fce4ec;
        }

        .sondos-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nav-dock {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 20px;
            padding: 12px 30px;
            border-radius: 50px;
            border: 2px solid var(--rose-soft);
            z-index: 1000;
        }

        .nav-btn {
            color: #d8a4b8;
            font-size: 1.7rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn.active { color: var(--rose-main); transform: scale(1.2); }

        #canvas-wrapper {
            background: white;
            border: 3px solid var(--rose-soft);
            border-radius: 20px;
            margin: 10px auto;
            width: 95%;
            height: 350px;
        }

        canvas { width: 100%; height: 100%; touch-action: none; border-radius: 17px; }

        .art-tools {
            margin-bottom: 90px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn-rose {
            background: var(--grad-rose);
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            color: #5d1049;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            font-size: 1rem;
            transition: 0.2s;
        }

        .btn-rose:active { transform: scale(0.95); }

        .card {
            background: white;
            padding: 20px;
            border-radius: 25px;
            margin: 15px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        #question-display {
            font-size: 1.3rem;
            color: #5d1049;
            margin-bottom: 20px;
            min-height: 60px;
        }
    </style>
</head>
<body>

    <section id="home" class="page active">
        <div class="hero">
            <h1 class="welcome-msg">أهلاً بكِ يا سندس 🌸</h1>
            <div class="sondos-frame">
                <img src="IMG-20250713-WA0003.jpg" alt="سندس العبقرية">
            </div>
            <p style="color: #a04060; margin-top:10px;">عبقرية العلوم والجمال</p>
        </div>
    </section>

    <section id="secrets" class="page">
        <h2 style="color: var(--rose-main)">🔐 حجرة الأسرار</h2>
        <div class="card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold;">
                <span>السؤال: <span id="question-number">1</span>/15</span>
                <span>النقاط: <span id="points-count">0</span></span>
            </div>
            <h3 id="question-display">جاري تجهيز التحدي...</h3>
            <div id="answers-grid"></div>
        </div>
        <button class="btn-rose" style="width: auto;" onclick="resetQuiz()">ابدأ مرحلة جديدة 🔄</button>
    </section>

    <section id="medical" class="page">
        <h2 style="color: var(--rose-main)">🩺 طب سندس</h2>
        <div class="card" onclick="alert('الأعصاب: رسائل سريعة تجعلك ذكية!')">🧠 الجهاز العصبي</div>
        <div class="card" onclick="alert('الخلايا: هي أساس بناء جسمك العجيب.')">🧬 الخلية</div>
    </section>

    <section id="lab" class="page">
        <h2 style="color: var(--rose-main)">🧪 معمل سندس</h2>
        <div id="beaker-icon" style="font-size: 80px;">🧪</div>
        <button class="btn-rose" style="width: auto;" onclick="mix()">إضافة مادة سحرية</button>
    </section>

    <section id="art" class="page">
        <h2 style="color: var(--rose-main)">🎨 لوحة إبداع سندس</h2>
        <div id="canvas-wrapper">
            <canvas id="mainCanvas"></canvas>
        </div>
        <div class="art-tools">
            <input type="color" id="colorPicker" value="#ff66b2" style="border:none; width:45px; height:45px;">
            <button class="btn-rose" style="width:auto;" onclick="clearBoard()">مسح</button>
            <button class="btn-rose" style="width:auto;" onclick="downloadArt()">حفظ الرسمة</button>
        </div>
    </section>

    <nav class="nav-dock">
        <div class="nav-btn active" onclick="goPage('home', this)"><i class="fas fa-home"></i></div>
        <div class="nav-btn" onclick="goPage('secrets', this)"><i class="fas fa-magic"></i></div>
        <div class="nav-btn" onclick="goPage('medical', this)"><i class="fas fa-heartbeat"></i></div>
        <div class="nav-btn" onclick="goPage('lab', this)"><i class="fas fa-vial"></i></div>
        <div class="nav-btn" onclick="goPage('art', this)"><i class="fas fa-palette"></i></div>
    </nav>

    <script>
        function goPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            btn.classList.add('active');
            if(pageId === 'art') initDrawing();
            if(pageId === 'secrets') { if(currentQuestionIndex === 0) resetQuiz(); }
        }

        // --- بنك أسئلة حجرة الأسرار (15+ سؤال) ---
        const questionBank = [
            { q: "ما هو الكوكب الأحمر؟", a: ["المريخ", "المشتري", "الزهرة"], c: 0 },
            { q: "ما هو الغاز الذي تتنفسه النباتات؟", a: ["الأكسجين", "ثاني أكسيد الكربون", "النيتروجين"], c: 1 },
            { q: "أين يوجد قلب الإنسان؟", a: ["الجهة اليمنى", "الوسط", "الجهة اليسرى قليلاً"], c: 2 },
            { q: "ما هو أقرب كوكب للشمس؟", a: ["عطارد", "الأرض", "نيبتون"], c: 0 },
            { q: "كم عدد حواس الإنسان؟", a: ["3 حواس", "5 حواس", "7 حواس"], c: 1 },
            { q: "ما هو المعدن السائل في درجة الحرارة العادية؟", a: ["الحديد", "الذهب", "الزئبق"], c: 2 },
            { q: "ما هو أسرع حيوان بري؟", a: ["الأسد", "الفهد", "الحصان"], c: 1 },
            { q: "ما هو الغاز الذي يحمي الأرض من الأشعة الضارة؟", a: ["الأوزون", "الهيدروجين", "البخار"], c: 0 },
            { q: "كم عدد كواكب المجموعة الشمسية؟", a: ["7 كواكب", "8 كواكب", "9 كواكب"], c: 1 },
            { q: "ما هي المادة التي تصنع منها الأقلام الرصاص؟", a: ["الفحم", "الجرافيت", "الرصاص"], c: 1 },
            { q: "أكبر محيط في العالم هو؟", a: ["الأطلسي", "الهندي", "الهادئ"], c: 2 },
            { q: "مما يتكون الماء؟", a: ["أكسجين وهيدروجين", "أكسجين وكربون", "نيتروجين"], c: 0 },
            { q: "ما هي القوة التي تجذبنا نحو الأرض؟", a: ["المغناطيسية", "الجاذبية", "الكهربائية"], c: 1 },
            { q: "ما هو الجزء المسؤول عن تنفس السمكة؟", a: ["الرئتين", "الخياشيم", "الجلد"], c: 1 },
            { q: "ما هو أكبر حيوان في العالم؟", a: ["الفيل الأفريقي", "الحوت الأزرق", "الديناصور"], c: 1 },
            { q: "كم عدد عظام الإنسان البالغ؟", a: ["206 عظمة", "300 عظمة", "150 عظمة"], c: 0 },
            { q: "أين تقع الأهرامات؟", a: ["مصر", "السعودية", "العراق"], c: 0 },
            { q: "ما هو العضو المسؤول عن تصفية الدم؟", a: ["القلب", "الكبد", "الكلية"], c: 2 }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let sessionQuestions = [];

        function resetQuiz() {
            score = 0;
            currentQuestionIndex = 0;
            document.getElementById('points-count').innerText = score;
            // اختيار 15 سؤال عشوائي من البنك
            sessionQuestions = [...questionBank].sort(() => 0.5 - Math.random()).slice(0, 15);
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= 15) {
                document.getElementById('question-display').innerText = "تمت المهمة بنجاح يا عبقرية! 🎉";
                document.getElementById('answers-grid').innerHTML = `<p>لقد جمعتِ ${score} نقطة!</p>`;
                return;
            }

            const currentQ = sessionQuestions[currentQuestionIndex];
            document.getElementById('question-number').innerText = currentQuestionIndex + 1;
            document.getElementById('question-display').innerText = currentQ.q;
            
            const grid = document.getElementById('answers-grid');
            grid.innerHTML = '';
            
            currentQ.a.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-rose';
                btn.innerText = option;
                btn.onclick = () => checkAnswer(index);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            if (selected === sessionQuestions[currentQuestionIndex].c) {
                score += 10;
                alert("إجابة صحيحة يا ذكية! ✨");
            } else {
                alert("حاولي مرة أخرى في السؤال القادم 🌸");
            }
            document.getElementById('points-count').innerText = score;
            currentQuestionIndex++;
            loadQuestion();
        }

        // --- المعمل والرسوم ---
        function mix() { 
            const colors = ['#ff66b2', '#ffb7c5', '#9c27b0', '#2196f3', '#4caf50'];
            const randColor = colors[Math.floor(Math.random() * colors.length)];
            document.getElementById('beaker-icon').style.color = randColor; 
        }

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        function initDrawing() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            ctx.lineWidth = 5; ctx.lineCap = 'round';
        }

        canvas.onmousedown = (e) => { drawing = true; draw(e); };
        canvas.onmouseup = () => { drawing = false; ctx.beginPath(); };
        canvas.onmousemove = (e) => draw(e);
        canvas.ontouchstart = (e) => { drawing = true; draw(e.touches[0]); };
        canvas.ontouchend = () => { drawing = false; ctx.beginPath(); };
        canvas.ontouchmove = (e) => draw(e.touches[0]);

        function draw(e) {
            if(!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.strokeStyle = document.getElementById('colorPicker').value;
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke(); ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function clearBoard() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function downloadArt() {
            const link = document.createElement('a');
            link.download = 'sondos-art.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
        </html>
